# Proyecto de Xcode generado con XcodeGen (brew install xcodegen):   cd app && xcodegen generate
# Así el proyecto se describe en texto y no hace falta subir Apagon.xcodeproj al repo.
name: Apagon
options:
  bundleIdPrefix: es.ericsans
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Apagon:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Contenido            # datos/ (índice, reglas, casos, lista de modelos, ~5 MB): se copia tal cual en la app.
                                   # Los modelos NO van dentro: la app los descarga la primera vez.
                                   # (no se llama «Resources»: en iOS ese nombre en la raíz de la app da problemas al instalar)
        type: folder
        buildPhase: resources
    dependencies:
      - framework: vendor/llama.cpp/build-apple/llama.xcframework
        embed: true
    scheme:
      environmentVariables:        # solo al lanzar desde Xcode: usa los modelos de app/Modelos del Mac sin descargarlos
        APAGON_MODELOS: $(SRCROOT)/Modelos
    info:                          # XcodeGen escribe Info.plist con CFBundleIdentifier y el resto de claves básicas
      path: Info.plist
      properties:
        CFBundleDisplayName: "Apagón"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.ericsans.apagon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
